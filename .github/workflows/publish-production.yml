name: Publish to BC Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bc-production-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download AL compiler (VS Code AL extension)
        shell: pwsh
        run: |
          $vsixUrl = "https://marketplace.visualstudio.com/_apis/public/gallery/publishers/ms-dynamics-smb/vsextensions/al/latest/vspackage"
          Invoke-WebRequest -Uri $vsixUrl -OutFile al.vsix -MaximumRetryCount 3 -RetryIntervalSec 10
          Expand-Archive -Path al.vsix -DestinationPath alext -Force
          $alc = Get-ChildItem "alext\extension\bin\win32\alc.exe" -Recurse | Select-Object -First 1
          if (-not $alc) { throw "alc.exe nuk u gjet ne VSIX" }
          "ALC_PATH=$($alc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $alc.FullName /? | Select-Object -First 2

      - name: Compile and publish to Production
        shell: pwsh
        env:
          BC_CLIENT_ID: ${{ secrets.BC_CLIENT_ID }}
          BC_CLIENT_SECRET: ${{ secrets.BC_CLIENT_SECRET }}
        run: |
          .\scripts\Publish-Production.ps1 -BuildNumber ${{ github.run_number }}

      - name: Upload .app artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integra-app
          path: "*.app"
          if-no-files-found: ignore
